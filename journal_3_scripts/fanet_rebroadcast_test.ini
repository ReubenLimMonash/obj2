# Date: 28/08/2024
# Desc: To test new rebroadcasting modules
[General]

[Config Waypoint_No_Int]
description = Waypoint only, No Rebroadcasting, No Interference
network = fanet_adhoc_hosts_pcap_wt_manet_interference

# --------------------- Parameters of main UAVs-GCS system ---------------------------------- 
*.numPacketsRecord = ${NPR=-1} # Number of packets to record for uplink and downlink
*.numHosts = ${N=7} # NOTE: Remember to manually set the packetNameManual and packetNameWaypoint vars for the GCS UdpMonitorThroughputRx application based on ${N}
*.gcsX = ${GX=500} # X coord of GCS, in m
*.gcsY = ${GY=500} # Y coord of GCS, in m
*.uavRadius = ${R=5}
*.hdistRange = ${HDR=280} # The range of horizontal distance to travel, in m
*.uavSpeed = ${USP=26} 
*.swarmHeight = ${Z=165}
*.modulation = ${MCS="QPSK"} #"QAM-64", "QAM-64", "QAM-64", "QAM-16", "QAM-16", "QPSK", "QPSK", "BPSK"
*.MCSBitrate = ${BR= 13} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5
*.uavSendingInterval = ${EUSI=100} # In ms
*.gcsSendingInterval = ${EGSI=20} # In ms 
.waypointSendingInterval = ${EWSI=1000} # In ms
*.videoBitRate = ${VBR=2} # In Mbps. For interference video
*.videoPacketSize = ${VPS=1450} # In bytes (with header of 64 bytes). For interference video
.dlPcapCsvFilePath = ${DLPCSV="/home/research-student/omnet-fanet/uav_traffic_csv/djispark_dl.csv"} 
.ulPcapCsvFilePath = ${ULPCSV="/home/research-student/omnet-fanet/uav_traffic_csv/djispark_ul.csv"} 
.vidPcapCsvFilePath = ${VIDPCSV="/home/research-student/omnet-fanet/uav_traffic_csv/djispark_vid.csv"}  
# ------------ Throughput and Reliability Related ------------
.pktDelayThManual = ${PDTM=0.04} # Packet delay threshold for manual control (in s)
.pktDelayThWaypoint = ${PDTW=1} # Packet delay threshold for waypoint control (in s)
.pktDelayThVideo = ${PDTV=1} # Packet delay threshold for video link (in s)
.throughputTimeWindowManual = ${TTWM=1} # Time window to measure throughput under manual control (in s)
.throughputMeasureIntervalManual = ${TMIM=0.1} # Slide window interval to measure throughput under manual control (in s)
.throughputTimeWindowWaypoint = ${TTWW=1} # Time window to measure throughput under waypoint control (in s)
.throughputMeasureIntervalWaypoint = ${TMIW=1} # Slide window interval to measure throughput under waypoint control (in s)
.throughputTimeWindowVideo = ${TTWV=1} # Time window to measure throughput for video link (in s)
.throughputMeasureIntervalVideo = ${TMIV=0.1} # Slide window interval to measure throughput for video link (in s)
.dlThroughputThreshold = ${DLTT=1007} # Min throughput to trigger waypoint mode inn Downlink (bytes/sec)
.ulThroughputThreshold = ${ULTT=5512} # Min throughput to trigger waypoint mode inn Uplink (bytes/sec)
.vidThroughputThreshold = ${VLTT=174000} # Min throughput to trigger waypoint mode inn Video link (bytes/sec)
# ------------------------------------------------------------
# ++++++++++++ Set No Interference ++++++++++++
*.numManetHosts = 0
*.interfererAreaRadius = ${IAR=500} # The radius of circle for the interferer area, in m
 # ++++++++++++++++++++++++++++++++++++++++++++++++
.manetStartTime = ${MST=0} # In s
*.manetModulation = ${MMCS="BPSK"} # MANET Nodes MCS
*.manetBitrate = ${MBR=6.5 ! MMCS} # MANET Nodes Bitrate

.csvFilePath = ${CSV="/media/research-student/KingstonSSD/FANET_Dataset/DJISpark_Measured_Throughput_100000_Samples/test/" + \
                "UAVSpeed-" + string(${USP}) + "_BitRate-" + string(${BR}) + "_Height-" + string(${Z}) + "_Distance-" + string(${HDR}) + "_Modulation-" + \
                ${MCS} + "_UAVSendingInterval-" + string(${EUSI})}
seed-set = ${SEED=2}

# ----------------------------------------------------
.bufferTime = ${BUFFERT = 1} # Buffer time for reception (in s)
.simTime = ${SIMTIME = ${HDR}s / ${USP} + ${BUFFERT}s} # Sim time based on distance to travel and speed (with 1 s as buffer for reception)
sim-time-limit = ${SIMTIME} 
# To avoid file name too long issue
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"  # use just the run number in the file name
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"  # use just the run number in the file name
eventlog-file = "${resultdir}/${configname}-${runnumber}.elog" # use just the run number in the file name
snapshot-file = "${resultdir}/${configname}-${runnumber}.sna" # use just the run number in the file name

# ----------- Mobility ---------- #
# GW-node mobility
*.gatewayNode.mobility.typename = "LinearMobility"
*.gatewayNode.mobility.initialY = ${GY}m
*.gatewayNode.mobility.initialX = ${GX}m
*.gatewayNode.mobility.initialZ = ${Z}m
*.gatewayNode.mobility.constraintAreaMinX = ${GX}m
*.gatewayNode.mobility.constraintAreaMaxX = ${HDR}m + ${GX}m
*.gatewayNode.mobility.speed = ${USP}mps
*.gatewayNode.mobility.initialMovementHeading = 0deg
*.gatewayNode.mobility.initFromDisplayString = false

# UAV member(s) mobility
*.adhocNode[*].mobility.typename = "AttachedMobility"
*.adhocNode[*].mobility.mobilityModule = "^.^.gatewayNode.mobility"
*.adhocNode[*].mobility.offsetX = ${R}m * cos(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetY = ${R}m * sin(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetZ = 0m
*.adhocNode[*].mobility.initFromDisplayString = false

# GCS mobility
**.GCS.mobility.typename = "StationaryMobility"
**.GCS.mobility.initialX = ${GX}m
**.GCS.mobility.initialY = ${GY}m
**.GCS.mobility.initialZ = 0m
**.GCS.mobility.initFromDisplayString = false

# Bounding box constraint
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 2 * ${IAR}m
**.constraintAreaMaxY = 2 * ${IAR}m
**.constraintAreaMaxZ = 300m

# ---------------- Network Layer --------------------#
**.ipv4.arp.typename = "GlobalArp"
# ---------------- Setting up routes and IP ------------------ #
*.configurator.config = xmldoc("fanet_multicast_config_interference.xml")
*.configurator.addStaticRoutes = false
#*.configurator.dumpConfig = "routes_dump.xml"
#*.configurator.dumpRoutes = true
#**.routingApp.typename = "Aodv"
# ----------- Setting up physical layer and channel ---------- #
# Radio
**.wlan[0].typename = "Ieee80211Interface"
**.wlan[0].radio.typename = "Ieee80211ScalarRadio"

# 802.11n
**.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.numAntennas = 1
**.bandwidth = 20MHz
**.centerFrequency = 2.4GHz
*.GCS.wlan[0].bitrate = ${BR}Mbps
*.GCS.wlan[0].radio.transmitter.modulation = ${MCS}
*.gatewayNode.wlan[0].bitrate = ${BR}Mbps
*.gatewayNode.wlan[0].radio.transmitter.modulation = ${MCS}
*.adhocNode[*].wlan[0].bitrate = ${BR}Mbps
*.adhocNode[*].wlan[0].radio.transmitter.modulation = ${MCS}

**.wlan[0].radio.transmitter.power = 100mW  # 20 dBm
**.wlan[0].radio.receiver.sensitivity = -90dBm
#**.wlan[0].radio.receiver.energyDetection = -90dBm
*.radioMedium.backgroundNoise.power = -86dBm # -107dBm, -86dBm
**.pathLoss.typename = "LognormalRicianFading"
**.pathLoss.a = 0.1
**.pathLoss.b = 0.00075
**.pathLoss.c = 8
**.pathLoss.alpha_min = 2
**.pathLoss.alpha_max = 2.75
**.pathLoss.sigma_a = 11.1852
**.pathLoss.sigma_b = 0.06
**.pathLoss.K_min = 1.4922 # (In dB) For suburban in 2.4GHz
**.pathLoss.K_max = 12.2272  # (In dB) For suburban in 2.4GHz
**.propagation.typename = "ConstantSpeedPropagation"

# Set fragmentation threshold to allow no-fragmentation of video packets
**.mac.dcf.originatorMacDataService.fragmentationPolicy.fragmentationThreshold = 1574B
# *.GCS.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.GCS.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.longRetryLimit = 0

# -----------  Application ---------- #
# GCS
*.GCS.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.GCS.numApps = 3 # 2
*.GCS.app[0].typename = "UdpGCSTxApp2Mode" # GCS Tx App; Starts in Manual and may switch to Waypoint
*.GCS.app[0].localPort = 5000
*.GCS.app[0].destPort = 5000
*.GCS.app[0].packetNameManual = "CNCManual"
*.GCS.app[0].packetNameWaypoint = "CNCWaypoint"
*.GCS.app[0].broadcastAddresses = "225.0.0.1" 
*.GCS.app[0].numMemberUAVs = ${N}
*.GCS.app[0].sendIntervalManual = ${EGSI}ms
*.GCS.app[0].sendIntervalWaypoint = ${EWSI}ms
*.GCS.app[0].startTime = uniform(0ms, 1ms)
*.GCS.app[0].stopTime = ${SIMTIME} - ${BUFFERT}s
*.GCS.app[0].numPacketRecord = ${NPR}
*.GCS.app[0].pcapCsvFileName = ${DLPCSV}
*.GCS.app[0].seed = ${SEED} # For shuffling PCAP data
*.GCS.app[0].timeToLive = 255

*.GCS.app[1].typename = "UdpMonitorThroughputRx" # GCS Rx App; For receiving UAV CNC packets
*.GCS.app[1].startTime = 0s
*.GCS.app[1].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring (reception will still take place)
*.GCS.app[1].localPort = 5001
*.GCS.app[1].receiveBroadcast = false
*.GCS.app[1].packetNameManual = "GatewayManual UAVManual_0 UAVManual_1 UAVManual_2 UAVManual_3 UAVManual_4 UAVManual_5 UAVManual_6 UAVManual_7"
*.GCS.app[1].packetNameWaypoint = "GatewayWaypoint UAVWaypoint_0 UAVWaypoint_1 UAVWaypoint_2 UAVWaypoint_3 UAVWaypoint_4 UAVWaypoint_5 UAVWaypoint_6 UAVWaypoint_7"
*.GCS.app[1].packetDelayThresholdManual = ${PDTM}s
*.GCS.app[1].packetDelayThresholdWaypoint = ${PDTW}s
*.GCS.app[1].throughputTimeWindowManual = ${TTWM}s
*.GCS.app[1].throughputMeasureIntervalManual = ${TMIM}s
*.GCS.app[1].throughputTimeWindowWaypoint = ${TTWW}s
*.GCS.app[1].throughputMeasureIntervalWaypoint = ${TMIW}s
*.GCS.app[1].throughputThreshold = ${ULTT}bytes # Unit is bytes but treated as bytes/sec

*.GCS.app[2].typename = "UdpMonitorVideoRx" # GCS Rx App; For receiving UAV Video packets
*.GCS.app[2].startTime = 0s
*.GCS.app[2].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring (reception will still take place)
*.GCS.app[2].localPort = 5002
*.GCS.app[2].receiveBroadcast = false
*.GCS.app[2].packetName = "Video"
*.GCS.app[2].packetDelayThreshold = ${PDTV}s # The delay threshold for waypoint mode and video link is the same
*.GCS.app[2].throughputTimeWindow = ${TTWV}s
*.GCS.app[2].throughputMeasureInterval = ${TMIV}s
*.GCS.app[2].throughputThreshold = ${VLTT}bytes # Unit is bytes but treated as bytes/sec

# Gateway
*.gatewayNode.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.gatewayNode.numApps = 3 # 2
*.gatewayNode.app[0].typename = "UdpMonitorThroughputRx"
*.gatewayNode.app[0].startTime = 0s
*.gatewayNode.app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring (reception will still take place)
*.gatewayNode.app[0].localPort = 5000
*.gatewayNode.app[0].receiveBroadcast = true
*.gatewayNode.app[0].multicastGroup = "225.0.0.1" 
*.gatewayNode.app[0].packetNameManual = "CNCManual"
*.gatewayNode.app[0].packetNameWaypoint = "CNCWaypoint"
*.gatewayNode.app[0].packetDelayThresholdManual = ${PDTM}s
*.gatewayNode.app[0].packetDelayThresholdWaypoint = ${PDTW}s
*.gatewayNode.app[0].throughputTimeWindowManual = ${TTWM}s
*.gatewayNode.app[0].throughputMeasureIntervalManual = ${TMIM}s
*.gatewayNode.app[0].throughputTimeWindowWaypoint = ${TTWW}s
*.gatewayNode.app[0].throughputMeasureIntervalWaypoint = ${TMIW}s
*.gatewayNode.app[0].throughputThreshold = ${DLTT}bytes # Unit is bytes but treated as bytes/sec

*.gatewayNode.app[1].typename = "UdpUAVTxApp2Mode"
*.gatewayNode.app[1].localPort = 5001
*.gatewayNode.app[1].destPort = 5001
*.gatewayNode.app[1].destAddresses = "GCS"
*.gatewayNode.app[1].packetNameManual = "GatewayManual"
*.gatewayNode.app[1].packetNameWaypoint = "GatewayWaypoint"
*.gatewayNode.app[1].sendIntervalManual = ${EUSI}ms
*.gatewayNode.app[1].sendIntervalWaypoint = ${EWSI}ms
*.gatewayNode.app[1].startTime = uniform(1ms, 10ms)
*.gatewayNode.app[1].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.gatewayNode.app[1].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.gatewayNode.app[1].pcapCsvFileName = ${ULPCSV}
*.gatewayNode.app[1].seed = ${SEED} + 1 # For shuffling PCAP data
*.gatewayNode.app[1].dontFragment = true
*.gatewayNode.app[1].timeToLive = 255

*.gatewayNode.app[2].typename = "UdpUAVVideoTxApp2Mode"
*.gatewayNode.app[2].localPort = 5002
*.gatewayNode.app[2].destPort = 5002
*.gatewayNode.app[2].messageLength = ${VPS}bytes
*.gatewayNode.app[2].sendInterval = ${VPS}ms * 8 * 0.001 / ${VBR}
*.gatewayNode.app[2].packetName = "Video" # Important to name it this
*.gatewayNode.app[2].destAddresses = "GCS"
*.gatewayNode.app[2].startTime = uniform(0ms, ${VPS}ms * 8 * 0.001 / ${VBR})
*.gatewayNode.app[2].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.gatewayNode.app[2].numPacketRecord = ${NPR}
*.gatewayNode.app[2].dontFragment = true
*.gatewayNode.app[2].timeToLive = 255

# UAVs
*.adhocNode[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.adhocNode[*].numApps = 2
*.adhocNode[*].app[0].typename = "UdpMonitorThroughputRx"
*.adhocNode[*].app[0].startTime = 0s
*.adhocNode[*].app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring (reception will still take place)
*.adhocNode[*].app[0].localPort = 5000
*.adhocNode[*].app[0].receiveBroadcast = true
*.adhocNode[*].app[0].multicastGroup = "225.0.0.1" 
*.adhocNode[*].app[0].packetNameManual = "CNCManual"
*.adhocNode[*].app[0].packetNameWaypoint = "CNCWaypoint"
*.adhocNode[*].app[0].packetDelayThresholdManual = ${PDTM}s
*.adhocNode[*].app[0].packetDelayThresholdWaypoint = ${PDTW}s
*.adhocNode[*].app[0].throughputTimeWindowManual = ${TTWM}s
*.adhocNode[*].app[0].throughputMeasureIntervalManual = ${TMIM}s
*.adhocNode[*].app[0].throughputTimeWindowWaypoint = ${TTWW}s
*.adhocNode[*].app[0].throughputMeasureIntervalWaypoint = ${TMIW}s
*.adhocNode[*].app[0].throughputThreshold = ${DLTT}bytes # Unit is bytes but treated as bytes/sec

*.adhocNode[*].app[1].typename = "UdpUAVTxApp2Mode"
*.adhocNode[*].app[1].localPort = 5001
*.adhocNode[*].app[1].destPort = 5001
*.adhocNode[*].app[1].destAddresses = "GCS"
*.adhocNode[*].app[1].packetNameManual = "UAVManual_" + string(parentIndex())
*.adhocNode[*].app[1].packetNameWaypoint = "UAVWaypoint_" + string(parentIndex())
*.adhocNode[*].app[1].sendIntervalManual = ${EUSI}ms
*.adhocNode[*].app[1].sendIntervalWaypoint = ${EWSI}ms
*.adhocNode[*].app[1].startTime = uniform(1ms, 10ms) + (10ms * (parentIndex() + 1))
*.adhocNode[*].app[1].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.adhocNode[*].app[1].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.adhocNode[*].app[1].pcapCsvFileName = ${ULPCSV}
*.adhocNode[*].app[1].seed = ${SEED} + 1 + parentIndex()# For shuffling PCAP data
*.adhocNode[*].app[1].dontFragment = true
*.adhocNode[*].app[1].timeToLive = 255

# Storing to CSV File
# Application level monitoring
*.GCS.wlan[0].radio.receiver.csvFilePath = ${CSV}
*.GCS.wlan[0].radio.receiver.csvFileName = "Run-" + string(${SEED}) + "_GCS-Wlan.csv"
*.GCS.app[*].csvFilePath = ${CSV}
*.GCS.app[0].csvFileNameRx = "Run-" + string(${SEED}) + "_GCS-Rx.csv"
*.GCS.app[0].csvFileNameTx = "Run-" + string(${SEED}) + "_GCS-Tx.csv"
*.GCS.app[1].csvFileNameRx = "Run-" + string(${SEED}) + "_GCS-Rx.csv"
*.GCS.app[1].csvFileNameThroughput = "Run-" + string(${SEED}) + "_GCS-Throughput.csv"
*.GCS.app[2].csvFileNameRx = "Run-" + string(${SEED}) + "_GCS-Video-Rx.csv"
*.GCS.app[2].csvFileNameThroughput = "Run-" + string(${SEED}) + "_GCS-Video-Throughput.csv"

*.gatewayNode.wlan[0].radio.receiver.csvFilePath = ${CSV}
*.gatewayNode.wlan[0].radio.receiver.csvFileName = "Run-" + string(${SEED}) + "_GW-Wlan.csv"
*.gatewayNode.app[*].csvFilePath = ${CSV}
*.gatewayNode.app[0].csvFileNameRx = "Run-" + string(${SEED}) + "_GW-Rx.csv"
*.gatewayNode.app[0].csvFileNameThroughput = "Run-" + string(${SEED}) + "_GW-Throughput.csv"
*.gatewayNode.app[1].csvFileNameTx = "Run-" + string(${SEED}) + "_GW-Tx.csv"
*.gatewayNode.app[1].csvFileNameRx = "Run-" + string(${SEED}) + "_GW-Rx.csv"
*.gatewayNode.app[2].csvFileName = "Run-" + string(${SEED}) + "_GW-Video-Tx.csv"

*.adhocNode[*].wlan[0].radio.receiver.csvFilePath = ${CSV}
*.adhocNode[*].wlan[0].radio.receiver.csvFileName = "Run-" + string(${SEED}) + "_UAV-" + string(ancestorIndex(3)) + "-Wlan.csv"
*.adhocNode[*].app[*].csvFilePath = ${CSV}
*.adhocNode[*].app[0].csvFileNameRx = "Run-" + string(${SEED}) + "_UAV-" + string(parentIndex()) + "-Rx.csv"
*.adhocNode[*].app[0].csvFileNameThroughput = "Run-" + string(${SEED}) + "_UAV-" + string(parentIndex()) + "-Throughput.csv"
*.adhocNode[*].app[1].csvFileNameTx = "Run-" + string(${SEED}) + "_UAV-" + string(parentIndex()) + "-Tx.csv"
*.adhocNode[*].app[1].csvFileNameRx = "Run-" + string(${SEED}) + "_UAV-" + string(parentIndex()) + "-Rx.csv"

**.csvFileNameSwitch = "Run-" + string(${SEED}) + "_Switch_Time.csv"

