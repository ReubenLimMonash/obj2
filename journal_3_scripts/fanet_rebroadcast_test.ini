[Config Waypoint_MANET_Int]
description = MANET Interference, Switch To Waypoint Mode
extends = Waypoint_No_Int
# ++++++++++++ Interference specific ++++++++++++
*.numManetHosts = 25
 # ++++++++++++++++++++++++++++++++++++++++++++++++

# Manet GW-node mobility
*.mGatewayNode.mobility.typename = "StationaryMobility"
*.mGatewayNode.mobility.initialX = 0m
*.mGatewayNode.mobility.initialY = ${GY}m
*.mGatewayNode.mobility.initialZ = 0m
*.mGatewayNode.mobility.initFromDisplayString = false

# MANET Ad-Hoc Nodes mobility
*.mAdhocNode[*].mobility.typename = "CircleRandomWaypointMobility"
*.mAdhocNode[*].mobility.cx = ${GX}m
*.mAdhocNode[*].mobility.cy = ${GY}m
*.mAdhocNode[*].mobility.cz = 0m
*.mAdhocNode[*].mobility.r = ${IAR}m
*.mAdhocNode[*].mobility.initAtCenter = false # To allow random uniform distribution in circle
*.mAdhocNode[*].mobility.speed = uniform(1mps, 5mps)
*.mAdhocNode[*].mobility.seed = ${SEED} + parentIndex()
*.mAdhocNode[*].mobility.initialMovementHeading = 0deg
*.mAdhocNode[*].mobility.initFromDisplayString = false
*.mGatewayNode.routingApp.typename = "Aodv"
*.mAdhocNode[*].routingApp.typename = "Aodv"

*.mGatewayNode.wlan[*].bitrate = ${MBR}Mbps
*.mGatewayNode.wlan[*].radio.transmitter.modulation = ${MMCS} 
*.mAdhocNode[*].wlan[*].bitrate = ${MBR}Mbps
*.mAdhocNode[*].wlan[*].radio.transmitter.modulation = ${MMCS} 

# MANET Gateway
*.mGatewayNode.numApps = 1
*.mGatewayNode.app[0].typename = "UdpSink"
*.mGatewayNode.app[0].localPort = 5000

# MANET Node
*.mAdhocNode[*].numApps = 1
*.mAdhocNode[*].app[0].typename = "UdpBasicApp"
*.mAdhocNode[*].app[0].localPort = 5000
*.mAdhocNode[*].app[0].destPort = 5000
*.mAdhocNode[*].app[0].messageLength = 512bytes
*.mAdhocNode[*].app[0].sendInterval = 200ms
*.mAdhocNode[*].app[0].packetName = "MANETPacket"
*.mAdhocNode[*].app[0].destAddresses = "mGatewayNode"
*.mAdhocNode[*].app[0].timeToLive = 255
*.mAdhocNode[*].app[0].startTime = uniform(${MST}s, ${MST}s + 200ms)
*.mAdhocNode[*].app[0].numPacketRecord = 0
*.mAdhocNode[*].app[0].dontFragment = true

.csvFilePath = ${CSV2="/media/research-student/KingstonSSD/FANET_Dataset/DJISpark_Measured_Throughput_100000_Samples/test2/" + \
                "UAVSpeed-" + string($USP) + "_BitRate-" + string($BR) + "_Height-" + string($Z) + "_Distance-" + string($HDR) + "_Modulation-" + \
                ${MCS} + "_UAVSendingInterval-" + string($EUSI)}

*.GCS.wlan[0].radio.receiver.csvFilePath = ${CSV2}
*.GCS.app[*].csvFilePath = ${CSV2}
*.gatewayNode.wlan[0].radio.receiver.csvFilePath = ${CSV2}
*.gatewayNode.app[*].csvFilePath = ${CSV2}
*.adhocNode[*].wlan[0].radio.receiver.csvFilePath = ${CSV2}
*.adhocNode[*].app[*].csvFilePath = ${CSV2}

[Config UAV_Rebroadcast_No_Int]
description = Test New Rebroadcast Modules, No Interference
extends = Waypoint_No_Int

.counterThreshold = ${CT=3} # Counter threshold to limit rebroadcastings
.broadcastProb = ${BP=0.5} # Broadcast probability for fixed case
*.remLifeThreshold = ${RL=150} # In ms
*.timeWindow = ${TL=1}
*.movingAverageWindow = ${MAW=1}

# Gateway Rebroadcast
*.gatewayNode.app[0].typename = "UdpUAVRebroadcastingApp"
*.gatewayNode.app[0].startTime = 0s
*.gatewayNode.app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring and rebroadcasting (reception will still take place)
*.gatewayNode.app[0].localPort = 5000
*.gatewayNode.app[0].destPort = 5000
*.gatewayNode.app[0].timeToLive = 255
*.gatewayNode.app[0].dontFragment = true
*.gatewayNode.app[0].receiveBroadcast = true
*.gatewayNode.app[0].joinLocalMulticastGroups = true
*.gatewayNode.app[0].broadcastAddress = "225.0.0.1"
*.gatewayNode.app[0].multicastInterface = "wlan0"
*.gatewayNode.app[0].packetNameManual = "CNCManual"
*.gatewayNode.app[0].packetNameWaypoint = "CNCWaypoint"
*.gatewayNode.app[0].packetDelayThresholdManual = ${PDTM}s
*.gatewayNode.app[0].packetDelayThresholdWaypoint = ${PDTW}s
*.gatewayNode.app[0].throughputTimeWindowManual = ${TTWM}s
*.gatewayNode.app[0].throughputMeasureIntervalManual = ${TMIM}s
*.gatewayNode.app[0].throughputTimeWindowWaypoint = ${TTWW}s
*.gatewayNode.app[0].throughputMeasureIntervalWaypoint = ${TMIW}s
*.gatewayNode.app[0].throughputThreshold = ${DLTT}bytes # Unit is bytes but treated as bytes/sec
*.gatewayNode.app[0].waitInterval = uniform(150ms, 250ms) 
*.gatewayNode.app[0].counterThreshold = ${CT}
