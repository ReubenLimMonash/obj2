[General]

[Config Waypoint_UAV_Int]
description = Waypoint only, No Rebroadcasting, UAV Interference
network = fanet_adhoc_hosts_pcap_wt_uav_interference_circle

# --------------------- Parameters of main UAVs-GCS system ---------------------------------- 
*.hdistRange = ${HDR=250, 360, 420, 170, 220, 140, 90, 20, 250,360,420,170,220,140,90,20,200,270,310,160,210,120,90,10,130,150,80} # The range of horizontal distance to travel, in m
