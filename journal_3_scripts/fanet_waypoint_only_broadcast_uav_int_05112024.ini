*.MCSBitrate = ${BR= 13.0, 13.0, 13.0, 26.0, 26.0, 26.0, 65.0, 65.0, 13.0, 13.0, 13.0, 26.0, 26.0, 26.0, 65.0, 65.0, 13.0, 13.0, 13.0, 26.0, 26.0, 26.0, 65.0, 65.0, 26.0, 26.0, 65.0 ! MCS} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5*.numPacketsRecord = ${NPR=-1} # Number of packets to record for uplink and downlink
*.numPacketsRecord = ${NPR=-1} # Number of packets to record for uplink and downlink
*.numHosts = ${N=7} # NOTE: Remember to manually set the packetNameManual and packetNameWaypoint vars for the GCS UdpMonitorThroughputRx application based on ${N}
*.gcsX = ${GX=500} # X coord of GCS, in m
*.gcsY = ${GY=500} # Y coord of GCS, in m
*.uavRadius = ${R=5}
*.uavSendingInterval = ${EUSI=100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 66.7,66.7,66.7,66.7,66.7,66.7,66.7,66.7,20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0,10.0,10.0,10.0 ! HDR} # In ms
*.gcsSendingInterval = ${EGSI=20} # In ms 
.waypointSendingInterval = ${EWSI=1000} # In ms
*.videoBitRate = ${VBR=2} # In Mbps. For interference video
*.videoPacketSize = ${VPS=1450} # In bytes (with header of 64 bytes). For interference video
.dlPcapCsvFilePath = ${DLPCSV="/home/research-student/reuben_ws/uav_traffic_csv/djispark_dl.csv"} 
.ulPcapCsvFilePath = ${ULPCSV="/home/research-student/reuben_ws/uav_traffic_csv/djispark_ul.csv"} 
*.waypointGCSPacketSize = ${WGPS=100} # CNC packet size from GCS under waypoint mode (-1 to take from PCAP)
# ============ String values of parameters for scenario script file name ============
*.uavSpeedStr = ${USPstr="6.0", "16.0", "26.0", "16.0", "26.0", "6.0", "26.0", "6.0", "6.0", "16.0", "26.0", "16.0", "26.0", "6.0", "26.0", "6.0", "6.0", "16.0", "26.0", "16.0", "26.0", "6.0", "26.0", "6.0", "16.0", "26.0", "26.0" ! HDR}  
*.swarmHeightStr = ${Zstr="60.0", "150.0", "300.0", "60.0", "150.0", "300.0", "60.0", "150.0", "60.0", "150.0", "300.0", "60.0", "150.0", "300.0", "60.0", "150.0", "60.0", "150.0", "300.0", "60.0", "150.0", "300.0", "60.0", "150.0", "60.0", "150.0", "60.0" ! HDR}
*.MCSBitrateStr = ${BRstr= "13.0", "13.0", "13.0", "26.0", "26.0", "26.0", "65.0", "65.0", "13.0", "13.0", "13.0", "26.0", "26.0", "26.0", "65.0", "65.0", "13.0", "13.0", "13.0", "26.0", "26.0", "26.0", "65.0", "65.0", "26.0", "26.0", "65.0" ! MCS} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5
*.uavSendingIntervalStr = ${EUSIstr= "100.0", "100.0", "100.0", "100.0", "100.0", "100.0", "100.0", "100.0", "66.7", "66.7", "66.7", "66.7", "66.7", "66.7", "66.7", "66.7", "20.0", "20.0", "20.0", "20.0", "20.0", "20.0", "20.0", "20.0", "10.0", "10.0", "10.0" ! HDR} # In ms
# ------------ Failure Detection Related ------------
.pktDelayThManual = ${PDTM=0.04} # Packet delay threshold for manual control (in s)
.pktDelayThWaypoint = ${PDTW=1} # Packet delay threshold for waypoint control (in s)
.nrTimeWindow = ${NRTW=1} # Time window to measure N_r under manual control
.nrMeasureInterval = ${NRMI=0.1}  #Interval to measure N_r under manual control
.ulNrThreshold = ${ULNRTH=78, 78, 78, 78, 78, 78, 78, 78, 114, 114, 114, 114, 114, 114, 114, 114, 376, 376, 376, 376, 376, 376, 376, 376, 752, 752, 752 ! EUSI} # Min N_r to trigger waypoint mode in UL
.dlNrThreshold = ${DLNRTH=48} # Min N_r to trigger waypoint mode in DL
# ------------------------------------------------------------
# ++++++++++++ Interference specific ++++++++++++
*.numUAVInterferers = ${NUI=8} # NOTE: Remember to set *.GCSInterferer[*].app[0].destAddresses for each case
*.numGCSInterferers = ${NGI=1} # Number of interference GCSs
# *.uavInterfererDmax = ${UIDM="170 180 200 200 210 220 220 220 210 210 210 200 190 190 170 170 140", \ # For OLD subset of UAV interferer heights
#                             "200 210 240 250 260 270 270 290 290 300 300 300 290 300 290 290 280", \
#                              "200 210 240 240 270 260 270 280 290 300 310 300 320 310 320 310 310"} # String delimited by space, corresponds to interferer UAV height
*.uavInterfererDmax = ${UIDM="170 200 210 220 210 210 190 170 140", \
                            "200 240 260 270 290 300 290 290 280", \
                             "200 240 270 270 290 310 320 320 310"} # String delimited by space, corresponds to interferer UAV height
*.uavInterfererHeight = ${UIH="60 90 120 150 180 210 240 270 300"} # String delimited by space, corresponds to interferer UAV Dmax
*.interfererAreaRadius = ${IAR=500} # The radius of circle for the interferer area, in m
*.interferingUAVSendingInterval = ${IUSI=100, 20, 20 ! UIDM} # Sending Interval of Interfering UAV (ms)
*.interferingGCSSendingInterval = ${IGSI=20} # Sending Interval of Interfering GCS (ms)
*.interferenceModulation = ${IMCS="QAM-16", "QPSK", "QPSK" ! UIDM} #"QAM-64", "QAM-16", "QPSK", "BPSK"
*.interferenceMCSBitrate = ${IBR=26, 19.5, 13 ! UIDM} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5
# ++++++++++++++++++++++++++++++++++++++++++++++++
seed-set = ${SEED=0..499}
# -------------------- Scenario Script --------------------
.scenarioCase = ${SCENECASE = "uav_scenario_0", "uav_scenario_1", "uav_scenario_2" ! UIDM}
*.scenarioScript = ${SS="height-" + ${Zstr} + "_usi-" + ${EUSIstr} + "_bitrate-" + ${BRstr} + "_uavspeed-" + ${USPstr} + "_run-" + string(${SEED}) + "_scenario_script.xml"}
*.scenarioManager.script = xmldoc("/home/research-student/reuben_ws/omnet-fanet/obj3_scenario_script_new/" + ${SCENECASE} + "/" + ${SS}) # Scenario Manager for Switching
# ----------------------------------------------------------
.csvFilePath = ${CSV="/media/research-student/KingstonSSD/FANET_Dataset/DJISpark_Obj3_Retransmission_Datasets/Waypoint_Only_UAV_Interference/" + ${SCENECASE} + "/" + \
                "UAVSpeed-" + string(${USP}) + "_Height-" + string(${Z}) + "_BitRate-" + string(${BR}) + "_Modulation-" + ${MCS} + "_UAVSendingInterval-" + string(${EUSI}) + "_Distance-" + string(${HDR}) + \
                "_InterferenceBitRate-" + string(${IBR}) + "_InterferenceUSI-" + string(${IUSI})}

# ----------------------------------------------------
.bufferTime = ${BUFFERT = 1} # Buffer time for reception (in s)
.simTime = ${SIMTIME = ${HDR}s / ${USP} + ${BUFFERT}s} # Sim time based on distance to travel and speed (with 1 s as buffer for reception)
sim-time-limit = ${SIMTIME} 
**.result-recording-modes = - # Don't record .sca and .vec stats
**.statistic-recording = false
**.scalar-recording = false
**.vector-recording = false
# To avoid file name too long issue
output-scalar-file = "${resultdir}/${runnumber}.sca"  # use just the run number in the file name
output-vector-file = "${resultdir}/${runnumber}.vec"  # use just the run number in the file name
eventlog-file = "${resultdir}/${runnumber}.elog" # use just the run number in the file name
snapshot-file = "${resultdir}/${runnumber}.sna" # use just the run number in the file name


# ----------- Mobility ---------- #
# GW-node mobility
*.gatewayNode.mobility.typename = "LinearMobility"
*.gatewayNode.mobility.initialY = ${GY}m
*.gatewayNode.mobility.initialX = ${GX}m
*.gatewayNode.mobility.initialZ = ${Z}m
*.gatewayNode.mobility.constraintAreaMinX = ${GX}m
*.gatewayNode.mobility.constraintAreaMaxX = ${HDR}m + ${GX}m
*.gatewayNode.mobility.speed = ${USP}mps
*.gatewayNode.mobility.initialMovementHeading = 0deg
*.gatewayNode.mobility.initFromDisplayString = false

# UAV member(s) mobility
*.adhocNode[*].mobility.typename = "AttachedMobility"
*.adhocNode[*].mobility.mobilityModule = "^.^.gatewayNode.mobility"
*.adhocNode[*].mobility.offsetX = ${R}m * cos(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetY = ${R}m * sin(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetZ = 0m
*.adhocNode[*].mobility.initFromDisplayString = false

# GCS mobility
**.GCS.mobility.typename = "StationaryMobility"
**.GCS.mobility.initialX = ${GX}m
**.GCS.mobility.initialY = ${GY}m
**.GCS.mobility.initialZ = 0m
**.GCS.mobility.initFromDisplayString = false

# GCS Interferer mobility. initialX and initialY defined at FANET_sim.ned
**.GCSInterferer[*].mobility.typename = "StationaryMobility"
**.GCSInterferer[*].mobility.initialZ = 0m
**.GCSInterferer[*].mobility.initFromDisplayString = false

# UAV Interferer mobility. cx and cy defined at FANET_sim.ned
**.uavInterferer[0].mobility.typename = "CircleRandomWaypointMobilityDmax"
**.uavInterferer[0].mobility.heights = ${UIH}
**.uavInterferer[0].mobility.dmax = ${UIDM}
**.uavInterferer[0].mobility.speed = 6mps + intuniform(0, 2) * 10mps # This makes UAV speed either 6/16/26 mps
**.uavInterferer[0].mobility.initAtCenter = true
**.uavInterferer[0].mobility.seed = ${SEED}
**.uavInterferer[0].mobility.initialMovementHeading = 0deg
**.uavInterferer[0].mobility.initFromDisplayString = false
**.uavInterferer[*].mobility.typename = "AttachedMobility"
**.uavInterferer[*].mobility.mobilityModule = "^.^.uavInterferer[0].mobility"
**.uavInterferer[*].mobility.offsetX = ${R}m * cos(parentIndex() * (6.283185 / (${NUI}-1)))
**.uavInterferer[*].mobility.offsetY = ${R}m * sin(parentIndex() * (6.283185 / (${NUI}-1)))
**.uavInterferer[*].mobility.offsetZ = 0m
**.uavInterferer[*].mobility.initFromDisplayString = false

# Bounding box constraint
**.constraintAreaMinX = -${IAR}m
**.constraintAreaMinY = -${IAR}m
**.constraintAreaMinZ = -${IAR}m
**.constraintAreaMaxX = 3 * ${IAR}m
**.constraintAreaMaxY = 3 * ${IAR}m
**.constraintAreaMaxZ = 300m

# ---------------- Network Layer --------------------#
**.ipv4.arp.typename = "GlobalArp"
# ---------------- Setting up routes and IP ------------------ #
*.configurator.config = xmldoc("fanet_multicast_config_interference.xml")
*.configurator.addStaticRoutes = false
#*.configurator.dumpConfig = "routes_dump.xml"
#*.configurator.dumpRoutes = true

# ----------- Setting up physical layer and channel ---------- #
# Radio
**.wlan[0].typename = "Ieee80211Interface"
**.wlan[0].radio.typename = "Ieee80211ScalarRadio"

# 802.11n
**.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.numAntennas = 1
**.bandwidth = 20MHz
**.centerFrequency = 2.4GHz
*.GCS.wlan[0].bitrate = ${BR}Mbps
*.GCS.wlan[0].radio.transmitter.modulation = ${MCS}
*.gatewayNode.wlan[0].bitrate = ${BR}Mbps
*.gatewayNode.wlan[0].radio.transmitter.modulation = ${MCS}
*.adhocNode[*].wlan[0].bitrate = ${BR}Mbps
*.adhocNode[*].wlan[0].radio.transmitter.modulation = ${MCS}
*.GCSInterferer[*].wlan[0].bitrate = ${IBR}Mbps
*.GCSInterferer[*].wlan[0].radio.transmitter.modulation = ${IMCS}
*.uavInterferer[*].wlan[0].bitrate = ${IBR}Mbps
*.uavInterferer[*].wlan[0].radio.transmitter.modulation = ${IMCS}

**.wlan[0].radio.transmitter.power = 100mW  # 20 dBm
**.wlan[0].radio.receiver.sensitivity = -90dBm
#**.wlan[0].radio.receiver.energyDetection = -90dBm
*.radioMedium.backgroundNoise.power = -86dBm # -107dBm, -86dBm
**.pathLoss.typename = "LognormalRicianFading"
**.pathLoss.a = 0.1
**.pathLoss.b = 0.00075
**.pathLoss.c = 8
**.pathLoss.alpha_min = 2
**.pathLoss.alpha_max = 2.75
**.pathLoss.sigma_a = 11.1852
**.pathLoss.sigma_b = 0.06
**.pathLoss.K_min = 1.4922 # (In dB) For suburban in 2.4GHz
**.pathLoss.K_max = 12.2272  # (In dB) For suburban in 2.4GHz
**.propagation.typename = "ConstantSpeedPropagation"

# Set fragmentation threshold to allow no-fragmentation of video packets
**.mac.dcf.originatorMacDataService.fragmentationPolicy.fragmentationThreshold = 1574B
# *.GCS.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.GCS.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.longRetryLimit = 0

# Allow multicast forwarding
**.multicastForwarding = true

# -----------  Application ---------- #
# GCS Tx Rx App For CNC
*.GCS.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.GCS.numApps = 2
*.GCS.app[0].typename = "UdpGCSTxRxApp_v3" # GCS Tx App; Starts in Manual and may switch to Waypoint
*.GCS.app[0].localPort = 5000
*.GCS.app[0].destPort = 5000
*.GCS.app[0].broadcastAddresses = "225.0.0.1" 
*.GCS.app[0].numMemberUAVs = ${N}
*.GCS.app[0].txPacketNameManual = "CNCManual"
*.GCS.app[0].txPacketNameWaypoint = "CNCWaypoint"
*.GCS.app[0].txPacketLengthWaypoint = ${WGPS}bytes
*.GCS.app[0].startTimeTx = uniform(0ms, 1ms)
*.GCS.app[0].startTimeRx = 0ms
*.GCS.app[0].stopTimeTx = ${SIMTIME} - ${BUFFERT}s
*.GCS.app[0].sendIntervalManual = ${EGSI}ms
*.GCS.app[0].sendIntervalWaypoint = ${EWSI}ms
*.GCS.app[0].timeToLive = 255
*.GCS.app[0].dontFragment = true
*.GCS.app[0].multicastInterface = "wlan0"
*.GCS.app[0].receiveBroadcast = true
*.GCS.app[0].joinLocalMulticastGroups = true
*.GCS.app[0].pcapCsvFileName = ${DLPCSV}
*.GCS.app[0].seed = ${SEED} # For shuffling PCAP data
*.GCS.app[0].numPacketRecord = ${NPR}
*.GCS.app[0].rxPacketNameManual = "GatewayManual UAVManual_0 UAVManual_1 UAVManual_2 UAVManual_3 UAVManual_4 UAVManual_5 UAVManual_6"
*.GCS.app[0].rxPacketDelayThresholdManual = ${PDTM}s
*.GCS.app[0].nrTimeWindow = ${NRTW}s
*.GCS.app[0].nrMeasureInterval = ${NRMI}s
*.GCS.app[0].nrThreshold = ${ULNRTH}
# GCS Video Rx App
*.GCS.app[1].typename = "UdpSinkRecordCsv"
*.GCS.app[1].localPort = 5001
*.GCS.app[1].receiveBroadcast = true

# Gateway Tx Rx App (No Rebroadcasting) For CNC. Tx App For Video.
*.gatewayNode.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.gatewayNode.numApps = 1
*.gatewayNode.app[0].typename = "UdpGWTxRxApp_v3"
*.gatewayNode.app[0].localPort = 5000
*.gatewayNode.app[0].destPort = 5000
*.gatewayNode.app[0].destAddresses = "GCS"
*.gatewayNode.app[0].txPacketNameManual = "GatewayManual"
*.gatewayNode.app[0].txPacketNameWaypoint = "GatewayWaypoint"
*.gatewayNode.app[0].startTimeTx = uniform(1ms, 10ms)
*.gatewayNode.app[0].startTimeRx = 0s
*.gatewayNode.app[0].stopTimeTx = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring and rebroadcasting (reception will still take place)
*.gatewayNode.app[0].sendIntervalManual = ${EUSI}ms
*.gatewayNode.app[0].sendIntervalWaypoint = ${EWSI}ms
*.gatewayNode.app[0].timeToLive = 255
*.gatewayNode.app[0].dontFragment = true
*.gatewayNode.app[0].multicastInterface = "wlan0"
*.gatewayNode.app[0].receiveBroadcast = true
*.gatewayNode.app[0].joinLocalMulticastGroups = true
*.gatewayNode.app[0].pcapCsvFileName = ${ULPCSV}
*.gatewayNode.app[0].seed = ${SEED} # For srand func
*.gatewayNode.app[0].videoPacketLength = ${VPS}bytes
*.gatewayNode.app[0].startTimeVid = uniform(0ms, ${VPS}ms * 8 * 0.001 / ${VBR})
*.gatewayNode.app[0].sendIntervalVideo = ${VPS}ms * 8 * 0.001 / ${VBR}
*.gatewayNode.app[0].txPacketNameVideo = "Video"
*.gatewayNode.app[0].vidDestPort = 5001
*.gatewayNode.app[0].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.gatewayNode.app[0].rxPacketNameWaypoint = "CNCWaypoint"
*.gatewayNode.app[0].rxPacketNameManual = "CNCManual"
*.gatewayNode.app[0].rxPacketDelayThresholdManual = ${PDTM}s
*.gatewayNode.app[0].nrTimeWindow = ${NRTW}s
*.gatewayNode.app[0].nrMeasureInterval = ${NRMI}s
*.gatewayNode.app[0].nrThreshold = ${DLNRTH}

# UAVs Tx Rx App (No Rebroadcasting) For CNC. 
*.adhocNode[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.adhocNode[*].numApps = 1
*.adhocNode[*].app[0].typename = "UdpUAVTxRxApp_v3"
*.adhocNode[*].app[0].localPort = 5000
*.adhocNode[*].app[0].destPort = 5000
*.adhocNode[*].app[0].destAddresses = "GCS"
*.adhocNode[*].app[0].txPacketNameManual = "UAVManual_" + string(parentIndex())
*.adhocNode[*].app[0].txPacketNameWaypoint = "UAVWaypoint_" + string(parentIndex())
*.adhocNode[*].app[0].startTimeTx = uniform(1ms, 10ms) + (10ms * (parentIndex() + 1))
*.adhocNode[*].app[0].startTimeRx = 0s
*.adhocNode[*].app[0].stopTimeTx = ${SIMTIME} - ${BUFFERT}s
*.adhocNode[*].app[0].sendIntervalManual = ${EUSI}ms
*.adhocNode[*].app[0].sendIntervalWaypoint = ${EWSI}ms
*.adhocNode[*].app[0].timeToLive = 255
*.adhocNode[*].app[0].dontFragment = true
*.adhocNode[*].app[0].multicastInterface = "wlan0"
*.adhocNode[*].app[0].receiveBroadcast = true
*.adhocNode[*].app[0].joinLocalMulticastGroups = true
*.adhocNode[*].app[0].pcapCsvFileName = ${ULPCSV}
*.adhocNode[*].app[0].seed = ${SEED} + 1 + parentIndex() # For srand func
*.adhocNode[*].app[0].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.adhocNode[*].app[0].rxPacketNameWaypoint = "CNCWaypoint"
*.adhocNode[*].app[0].rxPacketNameManual = "CNCManual"
*.adhocNode[*].app[0].rxPacketDelayThresholdManual = ${PDTM}s
*.adhocNode[*].app[0].nrTimeWindow = ${NRTW}s
*.adhocNode[*].app[0].nrMeasureInterval = ${NRMI}s
*.adhocNode[*].app[0].nrThreshold = ${DLNRTH}

# GCS Interferer
*.GCSInterferer[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.GCSInterferer[*].numApps = 3 # 2
*.GCSInterferer[*].app[0].typename = "UdpGCSCsvApp"
*.GCSInterferer[*].app[0].localPort = 5000
*.GCSInterferer[*].app[0].destPort = 5000
*.GCSInterferer[*].app[0].packetName = "GCSInterference"
*.GCSInterferer[*].app[0].destAddresses = "uavInterferer[0] uavInterferer[1] uavInterferer[2] uavInterferer[3] uavInterferer[4] uavInterferer[5] uavInterferer[6] uavInterferer[7]"
*.GCSInterferer[*].app[0].numMemberUAVs = 0
*.GCSInterferer[*].app[0].sendInterval = ${IGSI}ms
*.GCSInterferer[*].app[0].startTime = uniform(0ms, 1ms) 
# *.GCSInterferer[*].app[0].stopTime # Don't set stop time, keep interference going
*.GCSInterferer[*].app[0].numPacketRecord = 0
*.GCSInterferer[*].app[0].pcapCsvFileName = ${DLPCSV}
*.GCSInterferer[*].app[0].seed = ${SEED} + parentIndex() # For shuffling PCAP data
*.GCSInterferer[*].app[0].timeToLive = 255
*.GCSInterferer[*].app[1].typename = "UdpSink"
*.GCSInterferer[*].app[1].localPort = 5001
*.GCSInterferer[*].app[1].receiveBroadcast = true
*.GCSInterferer[*].app[2].typename = "UdpSink"
*.GCSInterferer[*].app[2].localPort = 5002
*.GCSInterferer[*].app[2].receiveBroadcast = true

# UAV Interferer
## Only interfering UAV [0] send CNC + Video to one single GCS, the others send CNC only to same single GCS
# Don't forget to use fanet_routes_interference_v2.xml if want to make uavInterferer[0] the gateway
*.uavInterferer[0].numApps = 3 # 2
*.uavInterferer[*].numApps = 2 # 2
*.uavInterferer[*].app[0].typename = "UdpSink"
*.uavInterferer[*].app[0].localPort = 5000
*.uavInterferer[*].app[0].receiveBroadcast = true
*.uavInterferer[*].app[1].typename = "UdpBasicCsvApp"
*.uavInterferer[*].app[1].localPort = 5001
*.uavInterferer[*].app[1].destPort = 5001
*.uavInterferer[*].app[1].packetName = "UAVInterference_" + string(parentIndex())
*.uavInterferer[*].app[1].destAddresses = "GCSInterferer[0]"
*.uavInterferer[*].app[1].timeToLive = 255
*.uavInterferer[*].app[1].sendInterval = ${IUSI}ms
