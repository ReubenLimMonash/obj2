# Date: 03/10/2024
# To simulate rebroadcasting for manual control
[General]

[Config Manual_UAV_Int]
description = To generate FANET dataset with traffic from PCAP CSV
network = fanet_adhoc_hosts_pcap_wt_uav_interference_circle
#record-eventlog = true

# ====================== FOR MANUAL CONTROL SCEHEME UNDER UAV INT ======================
# --------------------- Parameters of main UAVs-GCS system ---------------------------------- 
*.hdistRange = ${HDR=250, 360, 420, 170, 220, 140, 90, 20} # The range of horizontal distance to travel, in m
*.uavSpeed = ${USP=6, 16, 26, 16, 26, 6, 26, 6 ! HDR} 
*.swarmHeight = ${Z=60, 150, 300, 60, 150, 300, 60, 150 ! HDR}
*.modulation = ${MCS="QPSK", "QPSK", "QPSK", "QAM-16", "QAM-16", "QAM-16", "QAM-64", "QAM-64" ! HDR} #"QAM-64", "QAM-64", "QAM-64", "QAM-16", "QAM-16", "QPSK", "QPSK", "BPSK"
*.MCSBitrate = ${BR= 13, 13, 13, 26, 26, 26, 65, 65 ! MCS} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5
*.numPacketsRecord = ${NPR=-1} # Number of packets to record for uplink and downlink
*.numHosts = ${N=7} # NOTE: Remember to manually set the packetNameManual and packetNameWaypoint vars for the GCS UdpMonitorThroughputRx application based on ${N}
*.gcsX = ${GX=500} # X coord of GCS, in m
*.gcsY = ${GY=500} # Y coord of GCS, in m
*.uavRadius = ${R=5}
*.uavSendingInterval = ${EUSI=100} # In ms
*.gcsSendingInterval = ${EGSI=20} # In ms 
.waypointSendingInterval = ${EWSI=1000} # In ms
*.videoBitRate = ${VBR=2} # In Mbps. For interference video
*.videoPacketSize = ${VPS=1450} # In bytes (with header of 64 bytes). For interference video
.dlPcapCsvFilePath = ${DLPCSV="/home/rlim0005/uav_traffic_csv/djispark_dl.csv"} 
.ulPcapCsvFilePath = ${ULPCSV="/home/rlim0005/uav_traffic_csv/djispark_ul.csv"} 
# ++++++++++++ Interference specific ++++++++++++
*.numUAVInterferers = ${NUI=8} # NOTE: Remember to set *.GCSInterferer[*].app[0].destAddresses for each case
*.numGCSInterferers = ${NGI=1} # Number of interference GCSs
*.uavInterfererDmax = ${UIDM="170 180 200 200 210 220 220 220 210 210 210 200 190 190 170 170 140", \
                            "200 210 240 250 260 270 270 290 290 300 300 300 290 300 290 290 280", \
                             "200 210 240 240 270 260 270 280 290 300 310 300 320 310 320 310 310"} # String delimited by space, corresponds to interferer UAV height
*.uavInterfererHeight = ${UIH="60 70 90 100 120 130 150 160 180 190 210 220 240 250 270 280 300"} # String delimited by space, corresponds to interferer UAV Dmax
*.interfererAreaRadius = ${IAR=500} # The radius of circle for the interferer area, in m
*.interferingUAVSendingInterval = ${IUSI=100, 20, 20 ! UIDM} # Sending Interval of Interfering UAV (ms)
*.interferingGCSSendingInterval = ${IGSI=20} # Sending Interval of Interfering GCS (ms)
*.interferenceModulation = ${IMCS="QAM-16", "QPSK", "QPSK" ! UIDM} #"QAM-64", "QAM-16", "QPSK", "BPSK"
*.interferenceMCSBitrate = ${IBR=26, 19.5, 13 ! UIDM} # 65, 58.5, 52, 39, 26, 19.5, 13, 6.5
# ++++++++++++++++++++++++++++++++++++++++++++++++
# ------------ Throughput and Broadcasting Related ------------
.pktDelayThManual = ${PDT=0.04} # Packet delay threshold for manual control (in s)
.throughputTimeWindowManual = ${TTW=1} # Time window to measure throughput under manual control (in s)
.throughputMeasureIntervalManual = ${TMI=0.1} # Slide window interval to measure throughput under manual control (in s)
.counterThreshold = ${CT=3} # Counter threshold to limit rebroadcastings
.broadcastProb = ${BP=0.5} # Broadcast probability for fixed case
*.remLifeThreshold = ${RL=10} # In ms
*.timeWindow = ${TL=1}
*.movingAverageWindow = ${MAW=1}
# ------------------------------------------------------------
.scenarioCase = ${SCENECASE = "uav_scenario_0", "uav_scenario_1", "uav_scenario_2" ! UIDM}
.csvFilePath = ${CSV="/home/rlim0005/FANET_Dataset/DJISpark_Obj3_Retransmission_Datasets/Manual_Rebroadcasting_UAV_Interference/" + ${SCENECASE} + "/" + \
              "UAVSpeed-" + string(${USP}) + "_Height-" + string(${Z}) + "_BitRate-" + string(${BR}) + "_Modulation-" + ${MCS} + "_UAVSendingInterval-" + string(${EUSI}) + "_Distance-" + string(${HDR}) + \
              "_InterferenceBitRate-" + string(${IBR}) + "_InterferenceUSI-" + string(${IUSI})}
#.pcapFilePath = ${PCAP="/home/research-student/omnetpp_sim_results/PCAP_Test/GW.pcap"} 
seed-set = ${SEED=0..99} 

# -------------- For micro-sim ---------------------
.bufferTime = ${BUFFERT = 1} # Buffer time for reception (in s)
.simTime = ${SIMTIME = ${HDR}s / ${USP} + ${BUFFERT}s} # Sim time based on distance to travel and speed (with 1 s as buffer for reception)
sim-time-limit = ${SIMTIME} 
# To avoid file name too long issue
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"  # use just the run number in the file name
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"  # use just the run number in the file name
eventlog-file = "${resultdir}/${configname}-${runnumber}.elog" # use just the run number in the file name
snapshot-file = "${resultdir}/${configname}-${runnumber}.sna" # use just the run number in the file name
**.result-recording-modes = - # Don't record .sca and .vec stats

# ----------- Mobility ---------- #
# GW-node mobility
*.gatewayNode.mobility.typename = "LinearMobility"
*.gatewayNode.mobility.initialY = ${GY}m
*.gatewayNode.mobility.initialX = ${GX}m
*.gatewayNode.mobility.initialZ = ${Z}m
*.gatewayNode.mobility.constraintAreaMinX = ${GX}m
*.gatewayNode.mobility.constraintAreaMaxX = ${HDR}m + ${GX}m
*.gatewayNode.mobility.speed = ${USP}mps
*.gatewayNode.mobility.initialMovementHeading = 0deg
*.gatewayNode.mobility.initFromDisplayString = false

# UAV member(s) mobility
*.adhocNode[*].mobility.typename = "AttachedMobility"
*.adhocNode[*].mobility.mobilityModule = "^.^.gatewayNode.mobility"
*.adhocNode[*].mobility.offsetX = ${R}m * cos(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetY = ${R}m * sin(parentIndex() * (6.283185 / ${N}))
*.adhocNode[*].mobility.offsetZ = 0m
*.adhocNode[*].mobility.initFromDisplayString = false

# GCS mobility
**.GCS.mobility.typename = "StationaryMobility"
**.GCS.mobility.initialX = ${GXGCS=500}m
**.GCS.mobility.initialY = ${GY}m
**.GCS.mobility.initialZ = 0m
**.GCS.mobility.initFromDisplayString = false

# GCS Interferer mobility. initialX and initialY defined at FANET_sim.ned
**.GCSInterferer[*].mobility.typename = "StationaryMobility"
**.GCSInterferer[*].mobility.initialZ = 0m
**.GCSInterferer[*].mobility.initFromDisplayString = false

# UAV Interferer mobility. cx and cy defined at FANET_sim.ned
**.uavInterferer[0].mobility.typename = "CircleRandomWaypointMobilityDmax"
**.uavInterferer[0].mobility.heights = ${UIH}
**.uavInterferer[0].mobility.dmax = ${UIDM}
**.uavInterferer[0].mobility.speed = 6mps + intuniform(0, 2) * 10mps # This makes UAV speed either 6/16/26 mps
**.uavInterferer[0].mobility.initAtCenter = true
**.uavInterferer[0].mobility.seed = ${SEED}
**.uavInterferer[0].mobility.initialMovementHeading = 0deg
**.uavInterferer[0].mobility.initFromDisplayString = false
**.uavInterferer[*].mobility.typename = "AttachedMobility"
**.uavInterferer[*].mobility.mobilityModule = "^.^.uavInterferer[0].mobility"
**.uavInterferer[*].mobility.offsetX = ${R}m * cos(parentIndex() * (6.283185 / (${NUI}-1)))
**.uavInterferer[*].mobility.offsetY = ${R}m * sin(parentIndex() * (6.283185 / (${NUI}-1)))
**.uavInterferer[*].mobility.offsetZ = 0m
**.uavInterferer[*].mobility.initFromDisplayString = false

# Bounding box constraint
# Bounding box constraint
**.constraintAreaMinX = -${IAR}m - 1m
**.constraintAreaMinY = -${IAR}m - 1m
**.constraintAreaMinZ = -${IAR}m - 1m # For some reason it can clip to negative at the start briefly
**.constraintAreaMaxX = 3 * ${IAR}m + 1m
**.constraintAreaMaxY = 3 * ${IAR}m + 1m
**.constraintAreaMaxZ = 301m

#**.initFromDisplayString = false

# ---------------- Network Layer --------------------#
*.gatewayNode.ipv4.arp.typename = "GlobalArp"
*.GCS.ipv4.arp.typename = "GlobalArp"
*.adhocNode[*].ipv4.arp.typename = "GlobalArp"
*.GCSInterferer[*].ipv4.arp.typename = "GlobalArp"
*.uavInterferer[*].ipv4.arp.typename = "GlobalArp"
# ---------------- Setting up routes and IP ------------------ #
*.configurator.config = xmldoc("fanet_multicast_config_interference.xml")
*.configurator.addStaticRoutes = false
*.configurator.dumpConfig = "routes_dump.xml"
*.configurator.dumpRoutes = true

# ----------- Setting up physical layer and channel ---------- #
# Radio
**.wlan[0].typename = "Ieee80211Interface"
**.wlan[0].radio.typename = "Ieee80211ScalarRadio"

# 802.11n
**.wlan[0].opMode = "n(mixed-2.4Ghz)"
**.numAntennas = 1
**.bandwidth = 20MHz
**.centerFrequency = 2.4GHz
*.GCS.wlan[0].bitrate = ${BR}Mbps
*.GCS.wlan[0].radio.transmitter.modulation = ${MCS}
*.gatewayNode.wlan[0].bitrate = ${BR}Mbps
*.gatewayNode.wlan[0].radio.transmitter.modulation = ${MCS}
*.adhocNode[*].wlan[0].bitrate = ${BR}Mbps
*.adhocNode[*].wlan[0].radio.transmitter.modulation = ${MCS}
*.GCSInterferer[*].wlan[0].bitrate = ${IBR}Mbps
*.GCSInterferer[*].wlan[0].radio.transmitter.modulation = ${IMCS}
*.uavInterferer[*].wlan[0].bitrate = ${IBR}Mbps
*.uavInterferer[*].wlan[0].radio.transmitter.modulation = ${IMCS}

# Channel modelling 
**.wlan[0].radio.transmitter.power = 100mW 
**.wlan[0].radio.receiver.sensitivity = -90dBm
#**.wlan[0].radio.receiver.energyDetection = -90dBm
*.radioMedium.backgroundNoise.power = -86dBm # -107dBm, -86dBm
**.pathLoss.typename = "LognormalRicianFading"
**.pathLoss.a = 0.1
**.pathLoss.b = 0.00075
**.pathLoss.c = 8
**.pathLoss.alpha_min = 2
**.pathLoss.alpha_max = 2.75
**.pathLoss.sigma_a = 11.1852
**.pathLoss.sigma_b = 0.06
**.pathLoss.K_min = 1.4922 # (In dB) For suburban in 2.4GHz
**.pathLoss.K_max = 12.2272  # (In dB) For suburban in 2.4GHz
**.propagation.typename = "ConstantSpeedPropagation"

# Set fragmentation threshold to allow no-fragmentation of video packets
**.mac.dcf.originatorMacDataService.fragmentationPolicy.fragmentationThreshold = 1574B
# *.GCS.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.shortRetryLimit = 0
# *.GCS.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.gatewayNode.mac.dcf.recoveryProcedure.longRetryLimit = 0
# *.adhocNode[*].mac.dcf.recoveryProcedure.longRetryLimit = 0

# Allow multicast forwarding
**.multicastForwarding = true

# -----------  Application ---------- #
# Flow 1 Application (Broadcast CNC messages to UAV nodes) 
# GCS
*.GCS.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.GCS.numApps = 2
*.GCS.app[0].typename = "UdpGCSRebroadcastingExp"
*.GCS.app[0].startTime = 0s # This is for starting throughput monitoring
*.GCS.app[0].startTimeTx = uniform(0ms, 1ms)
*.GCS.app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring and rebroadcasting (reception will still take place)
*.GCS.app[0].localPort = 5000
*.GCS.app[0].destPort = 5000
*.GCS.app[0].timeToLive = 255
*.GCS.app[0].dontFragment = true
*.GCS.app[0].receiveBroadcast = true
*.GCS.app[0].joinLocalMulticastGroups = true
*.GCS.app[0].broadcastAddresses = "225.0.0.1"
*.GCS.app[0].multicastInterface = "wlan0"
*.GCS.app[0].numMemberUAVs = ${N}
*.GCS.app[0].sendInterval = ${EGSI}ms
*.GCS.app[0].numPacketRecord = ${NPR}
*.GCS.app[0].pcapCsvFileName = ${DLPCSV}
*.GCS.app[0].packetNameTx = "CNCManual"
*.GCS.app[0].packetNameRx = "GatewayManual UAVManual_0 UAVManual_1 UAVManual_2 UAVManual_3 UAVManual_4 UAVManual_5 UAVManual_6 UAVManual_7"
*.GCS.app[0].packetDelayThreshold = ${PDT}s
*.GCS.app[0].throughputTimeWindow = ${TTW}s
*.GCS.app[0].throughputMeasureInterval = ${TMI}s
*.GCS.app[0].waitInterval = uniform(1ms, 2ms)
*.GCS.app[0].remainingTimeThreshold = ${RL}ms
*.GCS.app[0].throughputBaseline = 4400 # In bytes per sec (don't give unit in .ned file)
*.GCS.app[0].movingAverageSize = ${MAW}
*.GCS.app[0].maxBroadcast = 7
*.GCS.app[0].version = 2 # 1: Throughput-Based, 2: 100%
*.GCS.app[0].seed = ${SEED} # For srand func and shuffling PCAP data

*.GCS.app[1].typename = "UdpSinkRecordCsv" # GCS Rx App; For receiving UAV Video packets
*.GCS.app[1].localPort = 5002
*.GCS.app[1].receiveBroadcast = false

# Gateway
*.gatewayNode.ipv4.ip.directBroadcastInterfaces = "wlan0"
*.gatewayNode.numApps = 3 # 2
# Gateway Rebroadcast
*.gatewayNode.app[0].typename = "UdpUAVRebroadcastingExp"
*.gatewayNode.app[0].startTime = 0s
*.gatewayNode.app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring and rebroadcasting (reception will still take place)
*.gatewayNode.app[0].localPort = 5000
*.gatewayNode.app[0].destPort = 5000
*.gatewayNode.app[0].timeToLive = 255
*.gatewayNode.app[0].dontFragment = true
*.gatewayNode.app[0].receiveBroadcast = true
*.gatewayNode.app[0].joinLocalMulticastGroups = true
*.gatewayNode.app[0].broadcastAddress = "225.0.0.1"
*.gatewayNode.app[0].multicastInterface = "wlan0"
*.gatewayNode.app[0].packetName = "CNCManual"
*.gatewayNode.app[0].packetDelayThreshold = ${PDT}s
*.gatewayNode.app[0].throughputTimeWindow = ${TTW}s
*.gatewayNode.app[0].throughputMeasureInterval = ${TMI}s
*.gatewayNode.app[0].waitInterval = uniform(20us, 1000us) 
*.gatewayNode.app[0].counterThreshold = ${CT}
*.gatewayNode.app[0].fixedBroadcastProbability = ${BP}
*.gatewayNode.app[0].transmissionRange = 100 # In m
*.gatewayNode.app[0].uavSpeed = ${USP}
*.gatewayNode.app[0].remainingTimeThreshold = ${RL}ms
*.gatewayNode.app[0].throughputBaseline = 29 # In bytes per sec (don't give unit in .ned file)
*.gatewayNode.app[0].movingAverageSize = ${MAW}
*.gatewayNode.app[0].packetMonitoringTimeWindow = 10s
*.gatewayNode.app[0].packetsPerSecond = 1
*.gatewayNode.app[0].version = 4 # 1: Fixed-Prob, 2: Distance-Based, 3: Throughput-Based, 4: 100%
*.gatewayNode.app[0].seed = ${SEED} + 1 # For srand func

*.gatewayNode.app[1].typename = "UdpBasicCsvApp"
*.gatewayNode.app[1].localPort = 5001
*.gatewayNode.app[1].destPort = 5000
*.gatewayNode.app[1].destAddresses = "GCS"
*.gatewayNode.app[1].packetName = "GatewayManual"
*.gatewayNode.app[1].sendInterval = ${EUSI}ms
*.gatewayNode.app[1].startTime = uniform(1ms, 10ms)
*.gatewayNode.app[1].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.gatewayNode.app[1].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.gatewayNode.app[1].pcapCsvFileName = ${ULPCSV}
*.gatewayNode.app[1].seed = ${SEED} + 1 # For shuffling PCAP data
*.gatewayNode.app[1].dontFragment = true
*.gatewayNode.app[1].timeToLive = 255

*.gatewayNode.app[2].typename = "UdpBasicAppRecordCsv"
*.gatewayNode.app[2].localPort = 5002
*.gatewayNode.app[2].destPort = 5002
*.gatewayNode.app[2].messageLength = ${VPS}bytes
*.gatewayNode.app[2].sendInterval = ${VPS}ms * 8 * 0.001 / ${VBR}
*.gatewayNode.app[2].packetName = "GatewayVideo" # Important to name it this
*.gatewayNode.app[2].destAddresses = "GCS"
*.gatewayNode.app[2].startTime = uniform(0ms, ${VPS}ms * 8 * 0.001 / ${VBR})
*.gatewayNode.app[2].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.gatewayNode.app[2].numPacketRecord = ${NPR}
*.gatewayNode.app[2].dontFragment = true
*.gatewayNode.app[2].timeToLive = 255

# UAVs
*.adhocNode[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.adhocNode[*].numApps = 2
*.adhocNode[*].app[0].typename = "UdpUAVRebroadcastingExp"
*.adhocNode[*].app[0].startTime = 0s
*.adhocNode[*].app[0].stopTime = ${SIMTIME} - ${BUFFERT}s # when to stop throughput monitoring and rebroadcasting (reception will still take place)
*.adhocNode[*].app[0].localPort = 5000
*.adhocNode[*].app[0].destPort = 5000
*.adhocNode[*].app[0].timeToLive = 255
*.adhocNode[*].app[0].dontFragment = true
*.adhocNode[*].app[0].receiveBroadcast = true
*.adhocNode[*].app[0].joinLocalMulticastGroups = true
*.adhocNode[*].app[0].broadcastAddress = "225.0.0.1"
*.adhocNode[*].app[0].multicastInterface = "wlan0"
*.adhocNode[*].app[0].packetName = "CNCManual"
*.adhocNode[*].app[0].packetDelayThreshold = ${PDT}s
*.adhocNode[*].app[0].throughputTimeWindow = ${TTW}s
*.adhocNode[*].app[0].throughputMeasureInterval = ${TMI}s
*.adhocNode[*].app[0].waitInterval = uniform(20us, 1000us) 
*.adhocNode[*].app[0].counterThreshold = ${CT}
*.adhocNode[*].app[0].fixedBroadcastProbability = ${BP}
*.adhocNode[*].app[0].transmissionRange = 100 # In m
*.adhocNode[*].app[0].uavSpeed = ${USP}
*.adhocNode[*].app[0].remainingTimeThreshold = ${RL}ms
*.adhocNode[*].app[0].throughputBaseline = 29 # In bytes per sec (don't give unit in .ned file)
*.adhocNode[*].app[0].movingAverageSize = ${MAW}
*.adhocNode[*].app[0].version = 4 # 1: Fixed-Prob, 2: Distance-Based, 3: Throughput-Based, 4: 100%
*.adhocNode[*].app[0].seed = ${SEED} + 1 + parentIndex() # For srand func

*.adhocNode[*].app[1].typename = "UdpBasicCsvApp"
*.adhocNode[*].app[1].localPort = 5001
*.adhocNode[*].app[1].destPort = 5000
*.adhocNode[*].app[1].destAddresses = "GCS"
*.adhocNode[*].app[1].packetName = "UAVManual_" + string(parentIndex())
*.adhocNode[*].app[1].sendInterval = ${EUSI}ms
*.adhocNode[*].app[1].startTime = uniform(1ms, 10ms) + (10ms * (parentIndex() + 1))
*.adhocNode[*].app[1].stopTime = ${SIMTIME} - ${BUFFERT}s 
*.adhocNode[*].app[1].numPacketRecord = ${NPR} # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.adhocNode[*].app[1].pcapCsvFileName = ${ULPCSV}
*.adhocNode[*].app[1].seed = ${SEED} + 1 + parentIndex()# For shuffling PCAP data
*.adhocNode[*].app[1].dontFragment = true
*.adhocNode[*].app[1].timeToLive = 255

# GCS Interferer
*.GCSInterferer[*].ipv4.ip.directBroadcastInterfaces = "wlan0"
*.GCSInterferer[*].numApps = 3 # 2
*.GCSInterferer[*].app[0].typename = "UdpGCSCsvApp"
*.GCSInterferer[*].app[0].localPort = 5000
*.GCSInterferer[*].app[0].destPort = 5000
*.GCSInterferer[*].app[0].packetName = "GCSInterference"
*.GCSInterferer[*].app[0].destAddresses = "uavInterferer[0] uavInterferer[1] uavInterferer[2] uavInterferer[3] uavInterferer[4] uavInterferer[5] uavInterferer[6] uavInterferer[7]"
*.GCSInterferer[*].app[0].numMemberUAVs = 0
*.GCSInterferer[*].app[0].sendInterval = ${IGSI}ms
*.GCSInterferer[*].app[0].startTime = uniform(0ms, 1ms)
# *.GCSInterferer[*].app[0].stopTime # Don't set stop time, keep interference going
*.GCSInterferer[*].app[0].numPacketRecord = 0
*.GCSInterferer[*].app[0].pcapCsvFileName = ${DLPCSV}
*.GCSInterferer[*].app[0].seed = ${SEED} + parentIndex() # For shuffling PCAP data
*.GCSInterferer[*].app[0].timeToLive = 255
*.GCSInterferer[*].app[1].typename = "UdpSink"
*.GCSInterferer[*].app[1].localPort = 5001
*.GCSInterferer[*].app[1].receiveBroadcast = true
*.GCSInterferer[*].app[2].typename = "UdpSink"
*.GCSInterferer[*].app[2].localPort = 5002
*.GCSInterferer[*].app[2].receiveBroadcast = true

# UAV Interferer
## Only interfering UAV [0] send CNC + Video to one single GCS, the others send CNC only to same single GCS
# Don't forget to use fanet_routes_interference_v2.xml if want to make uavInterferer[0] the gateway
*.uavInterferer[0].numApps = 3 # 2
*.uavInterferer[*].numApps = 2 # 2
*.uavInterferer[*].app[0].typename = "UdpSink"
*.uavInterferer[*].app[0].localPort = 5000
*.uavInterferer[*].app[0].receiveBroadcast = true
*.uavInterferer[*].app[1].typename = "UdpBasicCsvApp"
*.uavInterferer[*].app[1].localPort = 5001
*.uavInterferer[*].app[1].destPort = 5001
*.uavInterferer[*].app[1].packetName = "UAVInterference_" + string(parentIndex())
*.uavInterferer[*].app[1].destAddresses = "GCSInterferer[0]"
*.uavInterferer[*].app[1].timeToLive = 255
*.uavInterferer[*].app[1].sendInterval = ${IUSI}ms
*.uavInterferer[*].app[1].startTime = uniform(1ms, 10ms)
# *.uavInterferer[*].app[1].stopTime # Don't set stop time, keep interference going
*.uavInterferer[*].app[1].numPacketRecord = 0 # NPR set to -1 to indicate record all packets sent # int(ceil(${NPR} / (${N}+1)))
*.uavInterferer[*].app[1].pcapCsvFileName = ${ULPCSV}
*.uavInterferer[*].app[1].seed = ${SEED} + parentIndex() # For shuffling PCAP data
*.uavInterferer[*].app[1].dontFragment = true
*.uavInterferer[0].app[2].typename = "UdpBasicApp" # Video App
*.uavInterferer[0].app[2].localPort = 5002
*.uavInterferer[0].app[2].destPort = 5002
*.uavInterferer[0].app[2].messageLength = ${VPS}bytes
*.uavInterferer[0].app[2].sendInterval = ${VPS}ms * 8 * 0.001 / ${VBR}
*.uavInterferer[0].app[2].packetName = "UAVInterfererVideo" # Important to name it this
*.uavInterferer[0].app[2].destAddresses = "GCSInterferer[0]"
*.uavInterferer[0].app[2].timeToLive = 255
*.uavInterferer[0].app[2].startTime = uniform(0ms, ${VPS}ms * 8 * 0.001 / ${VBR})
# *.uavInterferer[*].app[2].stopTime # Don't set stop time, keep interference going
*.uavInterferer[0].app[2].numPacketRecord = 0
*.uavInterferer[0].app[2].dontFragment = true

# Storing to CSV File
# Application level monitoring
*.GCS.wlan[0].radio.receiver.csvFilePath = ${CSV}
*.GCS.wlan[0].radio.receiver.csvFileName = "Run-" + string(${SEED}) + "_GCS-Wlan.csv"
*.GCS.app[*].csvFilePath = ${CSV}
