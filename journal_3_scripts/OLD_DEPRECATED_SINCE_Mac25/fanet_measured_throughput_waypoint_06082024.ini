# Date: 06/08/2024
# This dataset is to get the threshold (min) and baseline (mean) of measured throughput under waypoint mode at reliable region (tau_R) for both UL and DL.
# Simulating up to d_max for manual control with rel_th 99.9%.
# Modified: Use 100 runs instead of trying to get 10e5 samples.

[General]

[Config PCAP_Traffic]
description = To generate FANET measured throughput dataset with traffic from PCAP CSV
network = fanet_adhoc_hosts_pcap
