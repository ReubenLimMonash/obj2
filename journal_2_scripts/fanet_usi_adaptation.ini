#record-eventlog = true

# --------------------- TRAINING DATASET ----------------------------------
*.numPacketsRecord = ${NPR=-1} # NPR set to -1 to indicate record all packets sent
*.numHosts = ${N=7}
*.gcsX = ${GX=500} # X coord of GCS, in m
*.gcsY = ${GY=500} # Y coord of GCS, in m
*.uavRadius = ${R=5}
